<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVG Pointer Trail</title><style>*{box-sizing:border-box}body{margin:0;background:#15231f;color:#eef7eb;font-family:system-ui,sans-serif}header{position:absolute;top:24px;left:24px;right:24px;pointer-events:none}h1{font-size:clamp(24px,4vw,48px);margin:0}p{color:#b0c6b8;max-width:450px}button{pointer-events:auto;padding:10px 16px;border:1px solid #b7e3c5;background:#243e30;color:white;border-radius:6px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #f3c876;outline-offset:3px}svg{width:100vw;height:100vh;display:block}</style></head><body><header><h1>Follow the motion.</h1><p>Move your pointer to guide a trail of 30 SVG segments. A restored JavaScript learning experiment.</p><button id="toggle" type="button">Pause animation</button></header><svg id="canvas" viewBox="0 0 800 800" role="img" aria-label="Animated pointer-following SVG trail"></svg><script src="script.js"></script></body></html>
